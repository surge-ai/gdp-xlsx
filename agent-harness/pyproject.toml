[project]
name = "agent-harness"
version = "0.2.1"
description = "Minimal agent harness for professional domain tasks"
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk==1.45.0",
    "openhands-tools==1.45.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]
